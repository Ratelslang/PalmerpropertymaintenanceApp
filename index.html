<style>
:root{--bg:#0b1016;--panel:#121b25;--panel2:#172330;--line:#2a3b4c;--text:#edf4fa;--muted:#93a7ba;--accent:#39a9db;--accent2:#67d6a2;--warn:#f5b85d;--danger:#f06d6d;--violet:#b18cff;--shadow:0 16px 42px rgba(0,0,0,.28);--radius:16px}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#0a0f15,#111b25 48%,#0b1117);color:var(--text);font:14px/1.45 Inter,Segoe UI,Roboto,Arial,sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1480px;margin:auto;padding:18px}.topbar{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:16px 18px;background:rgba(18,27,37,.94);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);position:sticky;top:10px;z-index:20;backdrop-filter:blur(14px)}.brand{display:flex;align-items:center;gap:12px}.brand img{width:40px;height:40px;border-radius:11px}.brand h1{font-size:16px;margin:0;letter-spacing:.3px}.brand small{color:var(--muted)}.top-meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:flex-end}.pill,.badge{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);padding:4px 8px;border-radius:999px;font-size:11px;color:var(--muted);white-space:nowrap}.badge{font-weight:700;border:0}.b-new{background:#28445c;color:#bde8ff}.b-approval{background:#4d3b1f;color:#ffd787}.b-progress{background:#244837;color:#baf1d2}.b-overdue,.b-urgent{background:#582e33;color:#ffbbc0}.b-done{background:#303d4a;color:#cee0ef}.b-hold{background:#48365c;color:#e0cdfd}.nav{display:flex;gap:7px;overflow:auto;padding:14px 0 4px}.nav button{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--muted);padding:9px 12px;white-space:nowrap}.nav button.active,.nav button:hover{background:#203447;color:#fff;border-color:#3f6988}.view{padding:18px 0 70px}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(6,minmax(130px,1fr))}.card,.modal-card{background:linear-gradient(145deg,rgba(22,33,45,.98),rgba(14,22,31,.98));border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.card{padding:16px}.stat .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.7px}.stat .v{font-size:28px;font-weight:800;margin-top:5px}.stat .sub{font-size:11px;color:var(--muted);margin-top:4px}.two{grid-template-columns:1.15fr .85fr}.three{grid-template-columns:repeat(3,1fr)}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}.section-head h2,.section-head h3{margin:0;font-size:16px}.section-head p{color:var(--muted);font-size:12px;margin:2px 0 0}.btn{border:1px solid var(--line);background:#213344;color:#eaf4fb;border-radius:9px;padding:8px 11px;font-weight:700;font-size:12px}.btn:hover{filter:brightness(1.14)}.btn.primary{background:#147eaf;border-color:#219dcc}.btn.good{background:#207750;border-color:#329b6b}.btn.warn{background:#8a611e;border-color:#b78634}.btn.danger{background:#873a43;border-color:#b9525e}.btn.ghost{background:transparent}.btn.sm{padding:5px 8px;font-size:11px}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.controls input,.controls select,input,select,textarea{background:#0e1720;color:var(--text);border:1px solid #31475a;border-radius:9px;padding:8px 9px;outline:none}.controls input:focus,.controls select:focus,input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(57,169,219,.14)}.controls input{min-width:210px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:820px}.table th{text-align:left;padding:9px 10px;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--line)}.table td{padding:11px 10px;border-bottom:1px solid rgba(49,71,90,.58);vertical-align:top}.table tr.click{cursor:pointer}.table tr.click:hover{background:#1c2b3a}.muted{color:var(--muted)}.tiny{font-size:11px}.risk{border-left:4px solid var(--accent);padding:11px;background:#172533;border-radius:9px;margin:8px 0}.risk.warn{border-color:var(--warn)}.risk.danger{border-color:var(--danger)}.risk.good{border-color:var(--accent2)}.activity{display:grid;gap:8px}.activity-row{padding:9px;border-bottom:1px solid rgba(49,71,90,.6)}.activity-row:last-child{border:0}.activity-row b{font-size:12px}.activity-row span{font-size:11px;color:var(--muted);display:block}.progress{height:7px;border-radius:5px;background:#0d151d;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:5px}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed #395268;border-radius:12px}.property-card{padding:13px;border:1px solid var(--line);border-radius:12px;background:#14202b}.property-card h3{font-size:14px;margin:0 0 4px}.stack{display:grid;gap:10px}.list-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid rgba(49,71,90,.6)}.list-row:last-child{border:0}.amount{font-variant-numeric:tabular-nums;font-weight:800}.notice{padding:10px 12px;background:#1a2b39;border:1px solid #2d526b;border-radius:10px;color:#cce8f7;font-size:12px}.overlay{position:fixed;inset:0;background:rgba(3,8,13,.7);display:none;align-items:center;justify-content:center;padding:18px;z-index:40;backdrop-filter:blur(4px)}.overlay.show{display:flex}.modal-card{width:min(1050px,100%);max-height:92vh;overflow:auto;padding:18px}.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:13px;margin-bottom:14px}.modal-head h2{font-size:18px;margin:0}.close{border:0;background:#243748;color:#fff;width:32px;height:32px;border-radius:9px;font-size:18px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-grid .full{grid-column:1/-1}label{font-size:11px;text-transform:uppercase;letter-spacing:.55px;color:var(--muted);font-weight:700;display:grid;gap:5px}textarea{min-height:78px;resize:vertical}.form-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding-top:15px;border-top:1px solid var(--line);margin-top:15px}.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow:auto}.tabs button{border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);padding:9px 10px;white-space:nowrap}.tabs button.active{color:#fff;border-color:var(--accent)}.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kv{padding:9px;background:#101923;border:1px solid #2a3d4e;border-radius:9px}.kv .k{font-size:10px;color:var(--muted);text-transform:uppercase}.kv .v{font-size:12px;word-break:break-word}.timeline{border-left:2px solid #31546a;margin:5px 0;padding-left:14px}.event{padding:0 0 13px;position:relative}.event:before{content:'';position:absolute;width:9px;height:9px;background:var(--accent);border-radius:50%;left:-20px;top:5px}.event time{display:block;color:var(--muted);font-size:10px}.attachment{display:inline-flex;align-items:center;gap:5px;margin:4px;padding:6px 8px;background:#203447;border-radius:8px;font-size:11px}.toast{position:fixed;right:18px;bottom:18px;background:#142b3d;color:#fff;border:1px solid #3b6c8a;padding:11px 13px;border-radius:10px;box-shadow:var(--shadow);z-index:80;display:none}.toast.show{display:block}.print-only{display:none}@media(max-width:980px){.stats{grid-template-columns:repeat(3,1fr)}.two,.three{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.detail-grid{grid-template-columns:1fr}}@media(max-width:620px){.shell{padding:10px}.topbar{padding:12px}.top-meta{display:none}.stats{grid-template-columns:repeat(2,1fr)}.card{padding:13px}.nav{padding-top:10px}.controls input{min-width:140px;width:100%}.detail-grid{grid-template-columns:1fr}}@media print{body{background:#fff;color:#111}.no-print,.nav,.topbar,.overlay,.toast{display:none!important}.shell{max-width:none;padding:0}.card{box-shadow:none;border:1px solid #aaa;background:#fff}.print-only{display:block}.view{padding:0}.table{min-width:0}.table th,.table td{border-color:#bbb}}
</style>

<body><div class="shell"><header class="topbar no-print"><div class="brand"><img src="icon-192.png" alt="PPM"><div><h1>Palmer Property Maintenance</h1><small>Operations Control • Offline First</small></div></div><div class="top-meta"><span class="pill" id="versionPill">v8.1</span><span class="pill" id="storagePill">Storage checking…</span><span class="pill" id="backupPill">Backup: not recorded</span><button class="btn sm" onclick="printCurrentSection()">Save current view as PDF</button><button class="btn sm" onclick="openSettings()">Settings</button></div></header><nav class="nav no-print" id="nav"></nav><main class="view" id="view"></main></div><div class="overlay" id="overlay"><div class="modal-card" id="modal"></div></div><div class="toast" id="toast"></div>
<script>
'use strict';
const APP_VERSION='8.1.0', KEY='ppm_ops_v8', SNAP='ppm_ops_v8_snapshot', MAX_FILE=750000;
let state, route='dashboard', ticketFilter='all', ticketSearch='', activeDetailTab='overview';
const cats=['Electrical','Plumbing','Structural','Security','Geyser','Gate & Motor','Appliance','Paint & Waterproofing','Pest Control','Garden','Other'];
const statuses={new:'New',triage:'Triage',quotes:'Quotes',approval:'Awaiting Approval',approved:'Approved',scheduled:'Scheduled',progress:'In Progress',verify:'Verification',done:'Completed',return:'Return Visit',hold:'On Hold',declined:'Declined'};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const id=(p='id')=>p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,6);
const now=()=>new Date().toISOString(); const today=()=>now().slice(0,10);
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const money=v=>new Intl.NumberFormat('en-ZA',{style:'currency',currency:'ZAR',maximumFractionDigits:2}).format(Number(v||0));
const date=v=>v?new Date(v+'T12:00:00').toLocaleDateString('en-ZA',{day:'2-digit',month:'short',year:'numeric'}):'—';
const dateTime=v=>v?new Date(v).toLocaleString('en-ZA',{dateStyle:'medium',timeStyle:'short'}):'—';
function seed(){return {schema:8,settings:{operator:'Operations',owner:'Whiskey 1',lastBackup:'',monthlyBudget:0,lockPin:'',lastRelease:'',lastBackupNote:''},properties:[],contractors:[],tickets:[],audit:[],snapshotAt:'',ppmTemplates:[{id:'tpl_gutter',name:'Gutter and roof inspection',category:'Structural',frequency:180,priority:'normal',description:'Inspect gutters, roof drainage and visible waterproofing.'},{id:'tpl_geyser',name:'Geyser safety inspection',category:'Geyser',frequency:365,priority:'high',description:'Inspect pressure valve, drip tray, isolation valve and visible leaks.'},{id:'tpl_gate',name:'Gate motor service',category:'Gate & Motor',frequency:365,priority:'normal',description:'Service gate motor, safety beams, battery and remote operation.'}]};}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&x.schema)return x}catch(e){}return seed()}
function persist(reason='Saved'){try{localStorage.setItem(SNAP,localStorage.getItem(KEY)||'');state.snapshotAt=now();localStorage.setItem(KEY,JSON.stringify(state));updateHeader();if(reason) toast(reason)}catch(e){toast('Storage full — export a protected backup immediately.');console.error(e)}}
function audit(action,detail='',entity=''){state.audit.unshift({id:id('audit'),ts:now(),actor:state.settings.operator||'Operations',action,detail,entity});state.audit=state.audit.slice(0,1000)}
function ticketAudit(t,action,detail=''){t.history=t.history||[];t.history.unshift({id:id('evt'),ts:now(),actor:state.settings.operator||'Operations',action,detail});audit(action,detail,t.id)}
function init(){state=load();migrate();renderNav();render();updateHeader();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});}
function migrate(){state.properties??=[];state.contractors??=[];state.tickets??=[];state.audit??=[];state.ppmTemplates??=[];state.settings??=seed().settings;state.schema=8;}
function updateHeader(){let used=new Blob([JSON.stringify(state)]).size;let quota=5*1024*1024;$('#storagePill').textContent='Data '+(used/1048576).toFixed(2)+' MB / ~5 MB';$('#backupPill').textContent='Backup: '+(state.settings.lastBackup?dateTime(state.settings.lastBackup):'not recorded');}
function toast(t){let x=$('#toast');x.textContent=t;x.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>x.classList.remove('show'),3300)}
function openModal(html){$('#modal').innerHTML=html;$('#overlay').classList.add('show')}function closeModal(){$('#overlay').classList.remove('show');$('#modal').innerHTML=''}$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()});
function renderNav(){const tabs=[['dashboard','Dashboard'],['tickets','Work Orders'],['properties','Properties & Assets'],['schedule','Schedule & PPM'],['finance','Finance'],['contractors','Contractors'],['reports','Reports'],['settings','Data & Settings']];$('#nav').innerHTML=tabs.map(([k,l])=>`<button class="${route===k?'active':''}" onclick="go('${k}')">${l}</button>`).join('')}
function go(r){route=r;renderNav();render();window.scrollTo({top:0,behavior:'smooth'})}function render(){const f={dashboard:renderDashboard,tickets:renderTickets,properties:renderProperties,schedule:renderSchedule,finance:renderFinance,contractors:renderContractors,reports:renderReports,settings:renderSettings};f[route]();}
function statusBadge(s){return `<span class="badge b-${s==='approval'?'approval':s==='done'?'done':s==='progress'||s==='scheduled'?'progress':s==='hold'||s==='return'?'hold':s==='declined'?'overdue':'new'}">${esc(statuses[s]||s)}</span>`}
function priBadge(p){return p==='urgent'||p==='emergency'?`<span class="badge b-urgent">${esc(p).toUpperCase()}</span>`:''}
function overdue(t){return t.due&&t.status!=='done'&&t.status!=='declined'&&t.status!=='hold'&&t.due<today()}
function renderDashboard(){const open=state.tickets.filter(t=>!['done','declined'].includes(t.status));const urg=open.filter(t=>['urgent','emergency'].includes(t.priority));const od=open.filter(overdue);const approve=state.tickets.filter(t=>t.status==='approval');const scheduled=state.tickets.filter(t=>t.scheduledDate===today());const actual=open.concat(state.tickets.filter(t=>t.status==='done')).reduce((n,t)=>n+Number(t.actualCost||0),0);const budget=Number(state.settings.monthlyBudget||0);const alerts=[...od.map(t=>['danger','Overdue work order',`${t.ref} • ${t.propertyName} • due ${date(t.due)}`,t.id]),...urg.map(t=>['danger','Urgent / emergency',`${t.ref} • ${t.desc}`,t.id]),...approve.map(t=>['warn','Awaiting owner decision',`${t.ref} • ${money(selectedQuote(t)?.total||0)} • ${t.propertyName}`,t.id])].slice(0,7);$('#view').innerHTML=`<div class="section-head"><div><h2>Operations Dashboard</h2><p>Prioritised field control for ${esc(state.settings.owner||'Owner')} • ${date(today())}</p></div><div class="controls no-print"><button class="btn" onclick="printCurrentSection()">Save Dashboard as PDF</button><button class="btn primary" onclick="openTicketForm()">+ New Work Order</button><button class="btn" onclick="runPPM()">Run PPM Scan</button></div></div><div class="grid stats"><div class="card stat"><div class="k">Open work</div><div class="v">${open.length}</div><div class="sub">Active work orders</div></div><div class="card stat"><div class="k">Overdue</div><div class="v" style="color:var(--danger)">${od.length}</div><div class="sub">Due date missed</div></div><div class="card stat"><div class="k">Urgent</div><div class="v" style="color:var(--warn)">${urg.length}</div><div class="sub">Requires priority action</div></div><div class="card stat"><div class="k">Awaiting approval</div><div class="v" style="color:#ffd787">${approve.length}</div><div class="sub">Owner decision needed</div></div><div class="card stat"><div class="k">Scheduled today</div><div class="v" style="color:var(--accent2)">${scheduled.length}</div><div class="sub">Planned attendance</div></div><div class="card stat"><div class="k">Recorded actuals</div><div class="v" style="font-size:19px">${money(actual)}</div><div class="sub">${budget?money(budget)+' monthly budget':'Budget not set'}</div></div></div><div class="grid two" style="margin-top:14px"><section class="card"><div class="section-head"><div><h3>Action queue</h3><p>Sort the day by risk, deadline, and decision bottleneck.</p></div><button class="btn sm" onclick="go('tickets')">Open register</button></div>${alerts.length?alerts.map(a=>`<div class="risk ${a[0]}"><b>${esc(a[1])}</b><div class="tiny muted">${esc(a[2])}</div><button class="btn sm" style="margin-top:7px" onclick="openTicket('${a[3]}')">Open</button></div>`).join(''):'<div class="risk good"><b>No priority exceptions.</b><div class="tiny muted">There are no overdue, urgent, or approval-blocked jobs.</div></div>'}</section><section class="card"><div class="section-head"><div><h3>Recent operational activity</h3><p>Attribution is recorded against every change.</p></div></div><div class="activity">${state.audit.slice(0,8).map(a=>`<div class="activity-row"><b>${esc(a.action)}</b><span>${esc(a.actor)} • ${dateTime(a.ts)}${a.detail?' • '+esc(a.detail):''}</span></div>`).join('')||'<div class="empty">No activity recorded. Create the first work order.</div>'}</div></section></div><div class="grid two" style="margin-top:14px"><section class="card"><div class="section-head"><div><h3>Scheduled today</h3></div></div>${scheduled.length?scheduled.map(t=>ticketLine(t)).join(''):'<div class="empty">No work is scheduled for today.</div>'}</section><section class="card"><div class="section-head"><div><h3>Budget position</h3><p>Recorded actual cost against configured monthly budget.</p></div></div><div class="list-row"><span>Actual / recorded spend</span><b class="amount">${money(actual)}</b></div><div class="list-row"><span>Budget</span><b class="amount">${budget?money(budget):'Not set'}</b></div>${budget?`<div class="list-row"><span>Variance</span><b class="amount" style="color:${actual>budget?'var(--danger)':'var(--accent2)'}">${money(budget-actual)}</b></div><div class="progress"><i style="width:${Math.min(100,actual/budget*100)}%"></i></div>`:'<div class="notice">Set a monthly budget in Data & Settings to enable variance control.</div>'}</section></div>`}
function ticketLine(t){return `<div class="list-row"><div><b>${esc(t.ref)} • ${esc(t.propertyName)}</b><div class="tiny muted">${esc(t.area||'No area')} • ${esc(t.category)} • ${esc(t.nextOwner||'Unassigned')}</div></div><div>${priBadge(t.priority)} ${statusBadge(t.status)} <button class="btn sm" onclick="openTicket('${t.id}')">Open</button></div></div>`}
function renderTickets(){let ts=state.tickets.filter(t=>ticketFilter==='all'||(ticketFilter==='overdue'?overdue(t):t.status===ticketFilter)).filter(t=>JSON.stringify(t).toLowerCase().includes(ticketSearch.toLowerCase())).sort((a,b)=>overdue(b)-overdue(a)||(b.updatedAt||'').localeCompare(a.updatedAt||''));$('#view').innerHTML=`<div class="section-head"><div><h2>Work Orders</h2><p>Faults, approvals, scheduling, evidence, cost, and verified closure.</p></div><div class="controls"><button class="btn" onclick="exportCSV('tickets')">Export CSV</button><button class="btn" onclick="printCurrentSection()">Save Work Orders as PDF</button><button class="btn primary" onclick="openTicketForm()">+ New Work Order</button></div></div><div class="card"><div class="controls" style="margin-bottom:13px"><input id="search" value="${esc(ticketSearch)}" placeholder="Search reference, property, fault, contractor..." oninput="ticketSearch=this.value;renderTickets()"><select onchange="ticketFilter=this.value;renderTickets()"><option value="all">All statuses</option><option value="overdue" ${ticketFilter==='overdue'?'selected':''}>Overdue</option>${Object.entries(statuses).map(([k,v])=>`<option value="${k}" ${ticketFilter===k?'selected':''}>${v}</option>`).join('')}</select><button class="btn sm" onclick="ticketFilter='approval';renderTickets()">Awaiting approval</button><button class="btn sm" onclick="ticketFilter='scheduled';renderTickets()">Scheduled</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Reference / priority</th><th>Property / area</th><th>Fault / owner</th><th>Due / schedule</th><th>Financial</th><th>Status</th><th>Manage</th></tr></thead><tbody>${ts.map(t=>`<tr class="click" onclick="openTicket('${t.id}')"><td><b>${esc(t.ref)}</b><div>${priBadge(t.priority)}</div></td><td><b>${esc(t.propertyName)}</b><div class="tiny muted">${esc(t.area||'—')}</div></td><td>${esc(t.desc).slice(0,70)}<div class="tiny muted">Owner: ${esc(t.nextOwner||'Unassigned')}</div></td><td>${overdue(t)?'<b style="color:var(--danger)">OVERDUE</b> ':''}${date(t.due)}<div class="tiny muted">${t.scheduledDate?'Visit: '+date(t.scheduledDate):'Not scheduled'}</div></td><td>${selectedQuote(t)?money(selectedQuote(t).total):'—'}<div class="tiny muted">Actual: ${t.actualCost?money(t.actualCost):'—'}</div></td><td>${statusBadge(t.status)}</td><td><button class="btn sm" onclick="event.stopPropagation();openTicketForm('${t.id}')">Edit</button> <button class="btn sm danger" onclick="event.stopPropagation();deleteTicket('${t.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="7"><div class="empty">No work orders match this view.</div></td></tr>'}</tbody></table></div></div>`}
function propertyOptions(selected=''){return `<option value="">Select property</option>${state.properties.map(p=>`<option value="${p.id}" ${p.id===selected?'selected':''}>${esc(p.name)}${p.unit?' • '+esc(p.unit):''}</option>`).join('')}`}
function contractorOptions(selected=''){return `<option value="">Select contractor</option>${state.contractors.map(c=>`<option value="${c.id}" ${c.id===selected?'selected':''}>${esc(c.name)} • ${esc(c.category||'General')}</option>`).join('')}`}
function openTicketForm(editId=''){let t=editId?state.tickets.find(x=>x.id===editId):{priority:'normal',status:'new',due:'',category:'Other',propertyId:'',area:'',reporter:'',reporterContact:'',risk:'',nextOwner:state.settings.operator||'Operations',desc:'',scheduledDate:''};openModal(`<div class="modal-head"><div><h2>${editId?'Edit':'New'} Work Order</h2><p class="muted">Use clear location, risk, ownership, and due-date information.</p></div><button class="close" onclick="closeModal()">×</button></div><form id="ticketForm"><div class="form-grid"><label>Property<select name="propertyId" required>${propertyOptions(t.propertyId)}</select></label><label>Unit / area<input name="area" required value="${esc(t.area)}" placeholder="e.g. Unit 2 • main bathroom"></label><label>Reported by<input name="reporter" value="${esc(t.reporter)}" placeholder="Occupant / manager"></label><label>Reporter contact<input name="reporterContact" value="${esc(t.reporterContact)}" placeholder="Phone or email"></label><label>Category<select name="category">${cats.map(c=>`<option ${t.category===c?'selected':''}>${c}</option>`).join('')}</select></label><label>Priority<select name="priority">${['low','normal','high','urgent','emergency'].map(p=>`<option ${t.priority===p?'selected':''}>${p}</option>`).join('')}</select></label><label>Response / due date<input type="date" name="due" value="${esc(t.due)}"></label><label>Next action owner<input name="nextOwner" value="${esc(t.nextOwner)}" placeholder="Operations / contractor / owner"></label><label class="full">Fault description<textarea name="desc" required placeholder="Fault, impact, symptoms, and requested outcome">${esc(t.desc)}</textarea></label><label class="full">Safety risk / isolation required<textarea name="risk" placeholder="Electricity, water isolation, access risk, vulnerable occupant, or other safety controls.">${esc(t.risk)}</textarea></label><label>Appointment date<input type="date" name="scheduledDate" value="${esc(t.scheduledDate)}"></label><label>Appointment window<input name="appointmentWindow" value="${esc(t.appointmentWindow||'')}" placeholder="e.g. 09:00–11:00"></label><label class="full">Access instructions<textarea name="accessNotes" placeholder="Keyholder, gate, alarm, parking, tenant availability.">${esc(t.accessNotes||'')}</textarea></label></div><div class="form-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">${editId?'Save changes':'Create work order'}</button></div></form>`);$('#ticketForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));let p=state.properties.find(x=>x.id===d.propertyId);if(!p){toast('Select a property first.');return}if(editId){let old=state.tickets.find(x=>x.id===editId);Object.assign(old,d,{propertyName:p.name,updatedAt:now()});ticketAudit(old,'Work order updated','Core operational details changed');persist('Work order updated')}else{let n=state.tickets.length+1;let x={id:id('wo'),ref:'PPM-'+String(n).padStart(4,'0'),...d,propertyName:p.name,status:'new',createdAt:now(),updatedAt:now(),quotes:[],attachments:[],history:[],actualCost:'',invoiceNo:'',completionNote:'',verifiedBy:''};ticketAudit(x,'Work order created',`${x.ref} • ${x.propertyName}`);state.tickets.unshift(x);persist('Work order created')}closeModal();render()}}
function selectedQuote(t){return(t.quotes||[]).find(q=>q.id===t.selectedQuoteId)}
function openTicket(tid){let t=state.tickets.find(x=>x.id===tid);if(!t)return;activeDetailTab='overview';renderTicketDetail(t)}
function renderTicketDetail(t){const q=selectedQuote(t);let tab=activeDetailTab;openModal(`<div class="modal-head"><div><h2>${esc(t.ref)} • ${esc(t.propertyName)}</h2><p class="muted">${esc(t.area)} • ${esc(t.category)} • reported ${dateTime(t.createdAt)}</p></div><div>${priBadge(t.priority)} ${statusBadge(t.status)} <button class="close" onclick="closeModal()">×</button></div></div><div class="tabs"><button class="${tab==='overview'?'active':''}" onclick="activeDetailTab='overview';renderTicketDetail(state.tickets.find(x=>x.id==='${t.id}'))">Overview</button><button class="${tab==='quotes'?'active':''}" onclick="activeDetailTab='quotes';renderTicketDetail(state.tickets.find(x=>x.id==='${t.id}'))">Quotes & Approval</button><button class="${tab==='evidence'?'active':''}" onclick="activeDetailTab='evidence';renderTicketDetail(state.tickets.find(x=>x.id==='${t.id}'))">Evidence & Close-out</button><button class="${tab==='history'?'active':''}" onclick="activeDetailTab='history';renderTicketDetail(state.tickets.find(x=>x.id==='${t.id}'))">History</button></div>${tab==='overview'?ticketOverview(t):tab==='quotes'?ticketQuotes(t):tab==='evidence'?ticketEvidence(t):ticketHistory(t)}<div class="form-actions"><button class="btn primary" onclick="openTicketForm('${t.id}')">✏ Edit Job</button><button class="btn" onclick="printTicket('${t.id}')">Save Job Card as PDF</button><button class="btn danger" onclick="deleteTicket('${t.id}')">🗑 Delete Job</button></div>`)}
function ticketOverview(t){return `<div class="detail-grid"><div class="kv"><div class="k">Response due</div><div class="v" style="color:${overdue(t)?'var(--danger)':'inherit'}">${date(t.due)} ${overdue(t)?'• OVERDUE':''}</div></div><div class="kv"><div class="k">Next owner</div><div class="v">${esc(t.nextOwner||'Unassigned')}</div></div><div class="kv"><div class="k">Appointment</div><div class="v">${t.scheduledDate?date(t.scheduledDate)+' • '+esc(t.appointmentWindow||'Time not set'):'Not scheduled'}</div></div><div class="kv"><div class="k">Reported by</div><div class="v">${esc(t.reporter||'—')}<br>${esc(t.reporterContact||'')}</div></div><div class="kv"><div class="k">Selected contractor</div><div class="v">${esc(qName(t)||'Not selected')}</div></div><div class="kv"><div class="k">Selected quote</div><div class="v">${q?money(q.total):'—'}</div></div></div><div class="grid two" style="margin-top:12px"><div class="card"><h3 style="margin-top:0">Fault & control</h3><p>${esc(t.desc)}</p><div class="risk ${t.risk?'warn':'good'}"><b>Safety / isolation control</b><div class="tiny">${esc(t.risk||'No specific risk recorded.')}</div></div><div class="risk"><b>Access instruction</b><div class="tiny">${esc(t.accessNotes||'No access instruction recorded.')}</div></div></div><div class="card"><h3 style="margin-top:0">Workflow control</h3><label>Status<select id="statusChange">${Object.entries(statuses).map(([k,v])=>`<option value="${k}" ${t.status===k?'selected':''}>${v}</option>`).join('')}</select></label><label style="margin-top:10px">Next action / note<textarea id="statusNote" placeholder="What must happen next, by whom, and why?"></textarea></label><div class="form-actions"><button class="btn primary" onclick="changeStatus('${t.id}')">Record status change</button></div></div></div>`}
function qName(t){let q=selectedQuote(t);return q?.contractorName}
function changeStatus(tid){let t=state.tickets.find(x=>x.id===tid), s=$('#statusChange').value,n=$('#statusNote').value.trim();t.status=s;t.updatedAt=now();ticketAudit(t,'Status changed',`${statuses[s]}${n?' • '+n:''}`);persist('Status recorded');renderTicketDetail(t);render()}
function ticketQuotes(t){let q=selectedQuote(t);return `<div class="section-head"><div><h3>Quote comparison and owner decision</h3><p>Record scope, VAT, warranty, exclusions, and reason for selection.</p></div><button class="btn primary" onclick="openQuoteForm('${t.id}')">+ Add quote</button></div>${(t.quotes||[]).length?`<div class="table-wrap"><table class="table"><thead><tr><th>Contractor</th><th>Scope / lead time</th><th>Cost</th><th>Warranty / exclusions</th><th>Decision</th></tr></thead><tbody>${t.quotes.map(x=>`<tr><td><b>${esc(x.contractorName)}</b><div class="tiny muted">${esc(x.contact||'')}</div></td><td>${esc(x.scope)}<div class="tiny muted">Lead time: ${esc(x.leadTime||'—')}</div></td><td><b>${money(x.total)}</b><div class="tiny muted">VAT: ${money(x.vat||0)}</div></td><td>${esc(x.warranty||'—')}<div class="tiny muted">${esc(x.exclusions||'')}</div></td><td>${t.selectedQuoteId===x.id?'<span class="badge b-progress">Selected</span>':`<button class="btn sm" onclick="selectQuote('${t.id}','${x.id}')">Select</button>`}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No quotations recorded.</div>'}<div class="card" style="margin-top:14px"><h3 style="margin-top:0">Approval decision</h3><div class="form-grid"><label>Decision<select id="approvalDecision"><option value="">No decision recorded</option><option value="approved" ${t.approval?.decision==='approved'?'selected':''}>Approved</option><option value="declined" ${t.approval?.decision==='declined'?'selected':''}>Declined</option></select></label><label>Approver<input id="approvalBy" value="${esc(t.approval?.by||state.settings.owner||'Whiskey 1')}"></label><label class="full">Approval note / selected-quote reason<textarea id="approvalNote" placeholder="Reason, conditions, cap, instruction, or decline grounds.">${esc(t.approval?.note||'')}</textarea></label></div><div class="form-actions"><button class="btn ${q?'primary':'warn'}" onclick="recordApproval('${t.id}')">Record owner decision</button></div>${t.approval?.decision?`<div class="notice">${esc(t.approval.decision).toUpperCase()} by ${esc(t.approval.by)} • ${dateTime(t.approval.ts)}${t.approval.note?' • '+esc(t.approval.note):''}</div>`:'<div class="notice">Select a quote and record an attributed owner decision before instructing work.</div>'}</div>`}
function openQuoteForm(tid){let t=state.tickets.find(x=>x.id===tid);openModal(`<div class="modal-head"><div><h2>Add quotation • ${esc(t.ref)}</h2><p class="muted">Attach the document separately in Evidence if needed.</p></div><button class="close" onclick="openTicket('${tid}')">×</button></div><form id="quoteForm"><div class="form-grid"><label>Contractor<select name="contractorId" required>${contractorOptions()}</select></label><label>Quoted total (ZAR)<input name="total" type="number" min="0" step=".01" required></label><label>VAT amount (ZAR)<input name="vat" type="number" min="0" step=".01" value="0"></label><label>Lead time<input name="leadTime" placeholder="e.g. 2 business days"></label><label>Warranty<input name="warranty" placeholder="e.g. 12 months workmanship"></label><label>Quote reference<input name="reference" placeholder="Supplier quote number"></label><label class="full">Scope of work<textarea name="scope" required placeholder="Materials, work steps, and included outcome."></textarea></label><label class="full">Exclusions / qualifications<textarea name="exclusions" placeholder="Access, unknown damage, extra materials, payment conditions."></textarea></label></div><div class="form-actions"><button type="button" class="btn" onclick="openTicket('${tid}')">Cancel</button><button class="btn primary">Save quote</button></div></form>`);$('#quoteForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),c=state.contractors.find(x=>x.id===d.contractorId);t.quotes.push({id:id('quote'),...d,contractorName:c?.name||'Unknown',contact:c?.contact||'',ts:now()});t.status='quotes';t.updatedAt=now();ticketAudit(t,'Quote added',`${c?.name||'Unknown'} • ${money(d.total)}`);persist('Quote added');openTicket(tid);render()}}
function selectQuote(tid,qid){let t=state.tickets.find(x=>x.id===tid);t.selectedQuoteId=qid;t.status='approval';t.updatedAt=now();ticketAudit(t,'Quote selected',`${qName(t)} • ${money(selectedQuote(t).total)}`);persist('Quote selected — awaiting approval');openTicket(tid);render()}
function recordApproval(tid){let t=state.tickets.find(x=>x.id===tid),d=$('#approvalDecision').value,by=$('#approvalBy').value.trim(),note=$('#approvalNote').value.trim();if(!d){toast('Select approved or declined.');return}if(d==='approved'&&!selectedQuote(t)){toast('Select a quote before approval.');return}t.approval={decision:d,by,note,ts:now()};t.status=d==='approved'?'approved':'declined';t.updatedAt=now();ticketAudit(t,'Owner decision recorded',`${d} by ${by}${note?' • '+note:''}`);persist('Approval recorded');openTicket(tid);render()}
function ticketEvidence(t){return `<div class="grid two"><div class="card"><h3 style="margin-top:0">Field evidence</h3><p class="tiny muted">Images and documents are held locally in this browser. Maximum 750 KB per attachment to protect offline storage.</p><input id="attachFile" type="file" accept="image/*,.pdf,.doc,.docx" multiple onchange="handleAttachments('${t.id}',this.files)"><div style="margin-top:10px">${(t.attachments||[]).map(a=>`<span class="attachment">${esc(a.name)} <button class="btn sm" onclick="downloadAttachment('${t.id}','${a.id}')">Open</button> <button class="btn sm danger" onclick="removeAttachment('${t.id}','${a.id}')">×</button></span>`).join('')||'<div class="empty">No field evidence attached.</div>'}</div></div><div class="card"><h3 style="margin-top:0">Verified close-out</h3><div class="form-grid"><label>Actual cost (ZAR)<input id="actualCost" type="number" min="0" step=".01" value="${esc(t.actualCost)}"></label><label>Invoice reference<input id="invoiceNo" value="${esc(t.invoiceNo)}"></label><label>Verified by<input id="verifiedBy" value="${esc(t.verifiedBy)}" placeholder="Manager / occupant"></label><label>Warranty until<input id="warrantyUntil" type="date" value="${esc(t.warrantyUntil)}"></label><label class="full">Completion note<textarea id="completionNote" placeholder="Work completed, testing carried out, defects, or follow-up required.">${esc(t.completionNote)}</textarea></label></div><div class="form-actions"><button class="btn warn" onclick="closeOut('${t.id}','return')">Return visit required</button><button class="btn good" onclick="closeOut('${t.id}','done')">Verify and close job</button></div></div></div>`}
function handleAttachments(tid,files){let t=state.tickets.find(x=>x.id===tid);[...files].forEach(file=>{if(file.size>MAX_FILE){toast(file.name+' exceeds 750 KB and was not added.');return}let r=new FileReader();r.onload=()=>{t.attachments.push({id:id('file'),name:file.name,type:file.type,size:file.size,data:r.result,ts:now()});t.updatedAt=now();ticketAudit(t,'Evidence attached',file.name);persist('Evidence attached');renderTicketDetail(t)};r.readAsDataURL(file)})}

function downloadAttachment(tid,aid){let a=state.tickets.find(x=>x.id===tid)?.attachments.find(x=>x.id===aid);if(!a)return;let x=document.createElement('a');x.href=a.data;x.download=a.name;x.click()}
function removeAttachment(tid,aid){let t=state.tickets.find(x=>x.id===tid);t.attachments=t.attachments.filter(x=>x.id!==aid);ticketAudit(t,'Evidence removed','Attachment removed');persist('Evidence removed');renderTicketDetail(t)}
function closeOut(tid,status){let t=state.tickets.find(x=>x.id===tid),cost=$('#actualCost').value,note=$('#completionNote').value.trim(),by=$('#verifiedBy').value.trim();if(status==='done'&&(!cost||!note||!by)){toast('Actual cost, completion note, and verifier are required to close.');return}Object.assign(t,{actualCost:cost,invoiceNo:$('#invoiceNo').value.trim(),verifiedBy:by,warrantyUntil:$('#warrantyUntil').value,completionNote:note,status,completedAt:status==='done'?now():'',updatedAt:now()});ticketAudit(t,status==='done'?'Job verified and completed':'Return visit required',note);persist(status==='done'?'Job closed':'Return visit recorded');openTicket(tid);render()}
function deleteTicket(tid){if(!confirm('Permanently delete this work order? This is recorded only in the current browser.'))return;let t=state.tickets.find(x=>x.id===tid);audit('Work order deleted',t?.ref||'',tid);state.tickets=state.tickets.filter(x=>x.id!==tid);persist('Work order deleted');closeModal();render()}
function renderProperties(){let ps=state.properties;$('#view').innerHTML=`<div class="section-head"><div><h2>Properties & Assets</h2><p>Property intelligence, access control, assets, warranty, and preventive maintenance.</p></div><button class="btn" onclick="printCurrentSection()">Save Properties as PDF</button><button class="btn primary" onclick="openPropertyForm()">+ Add Property</button></div><div class="grid three">${ps.map(p=>`<div class="property-card"><div class="section-head"><div><h3>${esc(p.name)}</h3><p>${esc(p.unit||'No unit')} • ${esc(p.occupant||'No occupant')}</p></div><button class="btn sm" onclick="openProperty('${p.id}')">Open</button></div><div class="tiny muted">Owner: ${esc(p.owner||'—')}<br>Access: ${esc(p.access||'No instruction')}</div><div class="list-row"><span>Assets</span><b>${(p.assets||[]).length}</b></div><div class="list-row"><span>Open work</span><b>${state.tickets.filter(t=>t.propertyId===p.id&&!['done','declined'].includes(t.status)).length}</b></div></div>`).join('')||'<div class="empty">No properties yet. Add a property before creating work orders.</div>'}</div>`}
function openPropertyForm(pid=''){let p=pid?state.properties.find(x=>x.id===pid):{name:'',unit:'',address:'',owner:state.settings.owner||'',occupant:'',contact:'',access:'',emergency:'',notes:'',assets:[]};openModal(`<div class="modal-head"><div><h2>${pid?'Edit':'Add'} Property</h2><p class="muted">Keep access and emergency-information concise and current.</p></div><button class="close" onclick="closeModal()">×</button></div><form id="propertyForm"><div class="form-grid"><label>Property name / address<input name="name" value="${esc(p.name)}" required></label><label>Unit / block<input name="unit" value="${esc(p.unit)}"></label><label>Owner / landlord<input name="owner" value="${esc(p.owner)}"></label><label>Occupant<input name="occupant" value="${esc(p.occupant)}"></label><label>Occupant contact<input name="contact" value="${esc(p.contact)}"></label><label>Monthly budget (ZAR)<input name="budget" type="number" value="${esc(p.budget||'')}"></label><label class="full">Access / keys / alarm<textarea name="access">${esc(p.access)}</textarea></label><label class="full">Emergency isolation / hazards<textarea name="emergency">${esc(p.emergency)}</textarea></label><label class="full">Property notes<textarea name="notes">${esc(p.notes)}</textarea></label></div><div class="form-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save property</button></div></form>`);$('#propertyForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));if(pid){Object.assign(p,d);audit('Property updated',p.name,p.id)}else{p={id:id('prop'),...d,assets:[],createdAt:now()};state.properties.push(p);audit('Property added',p.name,p.id)}persist('Property saved');closeModal();render()}}
function openProperty(pid){let p=state.properties.find(x=>x.id===pid),assets=p.assets||[];openModal(`<div class="modal-head"><div><h2>${esc(p.name)}${p.unit?' • '+esc(p.unit):''}</h2><p class="muted">${esc(p.occupant||'No occupant')} • ${esc(p.contact||'No contact')}</p></div><button class="close" onclick="closeModal()">×</button></div><div class="grid two"><div class="card"><h3 style="margin-top:0">Operational profile</h3><div class="risk"><b>Access / keys / alarm</b><div class="tiny">${esc(p.access||'No access instruction')}</div></div><div class="risk ${p.emergency?'warn':'good'}"><b>Emergency isolation / hazards</b><div class="tiny">${esc(p.emergency||'No emergency controls recorded')}</div></div><p class="tiny muted">${esc(p.notes||'')}</p><button class="btn" onclick="openPropertyForm('${p.id}')">Edit profile</button></div><div class="card"><div class="section-head"><h3>Asset register</h3><button class="btn sm primary" onclick="openAssetForm('${p.id}')">+ Asset</button></div>${assets.map(a=>`<div class="list-row"><div><b>${esc(a.name)}</b><div class="tiny muted">${esc(a.location||'—')} • service every ${a.frequency||'—'} days • next ${date(a.nextDue)}</div></div><button class="btn sm" onclick="openAssetForm('${p.id}','${a.id}')">Edit</button></div>`).join('')||'<div class="empty">No assets registered. Add recurring-risk assets such as geysers, motors, or fire equipment.</div>'}</div></div><div class="card" style="margin-top:14px"><h3 style="margin-top:0">Property work history</h3>${state.tickets.filter(t=>t.propertyId===pid).map(ticketLine).join('')||'<div class="empty">No work orders linked to this property.</div>'}</div>`)}
function openAssetForm(pid,aid=''){let p=state.properties.find(x=>x.id===pid),a=aid?p.assets.find(x=>x.id===aid):{name:'',location:'',type:'',installDate:'',warrantyUntil:'',frequency:'365',nextDue:today(),notes:''};openModal(`<div class="modal-head"><div><h2>${aid?'Edit':'Add'} Asset • ${esc(p.name)}</h2></div><button class="close" onclick="openProperty('${pid}')">×</button></div><form id="assetForm"><div class="form-grid"><label>Asset name<input name="name" value="${esc(a.name)}" required placeholder="e.g. Geyser 150L"></label><label>Type<input name="type" value="${esc(a.type)}"></label><label>Location<input name="location" value="${esc(a.location)}"></label><label>Service interval (days)<input type="number" name="frequency" value="${esc(a.frequency)}"></label><label>Installation date<input type="date" name="installDate" value="${esc(a.installDate)}"></label><label>Warranty expires<input type="date" name="warrantyUntil" value="${esc(a.warrantyUntil)}"></label><label>Next service due<input type="date" name="nextDue" value="${esc(a.nextDue)}"></label><label class="full">Notes<textarea name="notes">${esc(a.notes)}</textarea></label></div><div class="form-actions"><button type="button" class="btn" onclick="openProperty('${pid}')">Cancel</button><button class="btn primary">Save asset</button></div></form>`);$('#assetForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));if(aid)Object.assign(a,d);else{a={id:id('asset'),...d};p.assets.push(a)}audit('Asset saved',`${p.name} • ${a.name}`,p.id);persist('Asset saved');openProperty(pid)}}
function renderSchedule(){let tasks=[];state.properties.forEach(p=>(p.assets||[]).forEach(a=>tasks.push({p,a,due:a.nextDue,kind:'Asset'})));state.tickets.filter(t=>t.scheduledDate||t.due).forEach(t=>tasks.push({t,due:t.scheduledDate||t.due,kind:'Work'}));tasks.sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));$('#view').innerHTML=`<div class="section-head"><div><h2>Schedule & Planned Maintenance</h2><p>Scheduled attendance, asset service intervals, and PPM work generation.</p></div><div class="controls"><button class="btn" onclick="printCurrentSection()">Save Schedule as PDF</button><button class="btn" onclick="openPPMTemplateForm()">Manage PPM templates</button><button class="btn primary" onclick="runPPM()">Run PPM Scan</button></div></div><div class="grid two"><section class="card"><div class="section-head"><h3>Upcoming work and services</h3></div>${tasks.map(x=>`<div class="list-row"><div><b>${x.kind==='Work'?esc(x.t.ref)+' • '+esc(x.t.propertyName):esc(x.a.name)+' • '+esc(x.p.name)}</b><div class="tiny muted">${x.kind==='Work'?esc(x.t.area):esc(x.a.location||'Asset')} • ${x.kind}</div></div><div>${date(x.due)} ${x.due<today()?'<span class="badge b-overdue">OVERDUE</span>':''} ${x.kind==='Work'?`<button class="btn sm" onclick="openTicket('${x.t.id}')">Open</button>`:`<button class="btn sm" onclick="createAssetWork('${x.p.id}','${x.a.id}')">Create work</button>`}</div></div>`).join('')||'<div class="empty">No scheduled work or asset service dates.</div>'}</section><section class="card"><div class="section-head"><h3>PPM templates</h3></div>${state.ppmTemplates.map(t=>`<div class="list-row"><div><b>${esc(t.name)}</b><div class="tiny muted">${esc(t.category)} • every ${t.frequency} days • ${esc(t.priority)}</div></div><button class="btn sm" onclick="openPPMTemplateForm('${t.id}')">Edit</button></div>`).join('')||'<div class="empty">No templates configured.</div>'}<div class="notice" style="margin-top:12px">PPM scan creates work orders for asset service dates due today or overdue; it does not silently close or modify live work.</div></section></div>`}

function renderSettings(){let last=state.settings.lastBackup;$('#view').innerHTML=`<div class="section-head"><div><h2>Data Protection & Settings</h2><p>Local data control, encrypted backups, restore preview, and operating identity.</p></div><div class="controls"><button class="btn primary" onclick="exportBackup()">Create encrypted backup</button><button class="btn" onclick="printCurrentSection()">Save Data & Settings as PDF</button><button class="btn warn" onclick="$('#importFile').click()">Restore or merge backup</button><input id="importFile" type="file" accept="application/json" style="display:none" onchange="importBackup(this.files[0])"></div></div><div class="grid two"><section class="card"><h3 style="margin-top:0">Operations configuration</h3><form id="settingsForm"><div class="form-grid"><label>Operator name<input name="operator" value="${esc(state.settings.operator)}"></label><label>Owner / approver<input name="owner" value="${esc(state.settings.owner)}"></label><label>Monthly budget (ZAR)<input name="monthlyBudget" type="number" min="0" value="${esc(state.settings.monthlyBudget)}"></label><label>Release notes / version note<input name="lastRelease" value="${esc(state.settings.lastRelease)}" placeholder="e.g. v8 initial field release"></label></div><div class="form-actions"><button class="btn primary">Save settings</button></div></form></section><section class="card"><h3 style="margin-top:0">Business continuity</h3><div class="risk ${last?'good':'danger'}"><b>Last recorded backup</b><div class="tiny">${last?dateTime(last):'No backup has been recorded yet. Create one before adding operational data.'}</div></div><div class="risk warn"><b>Restore discipline</b><div class="tiny">Always test a restore in a clean browser profile or second device. Keep the encrypted backup outside this browser and record its storage location.</div></div><button class="btn" onclick="restoreSnapshot()">Restore previous local snapshot</button></section></div><div class="card" style="margin-top:14px"><div class="section-head"><div><h3>Local audit ledger</h3><p>Most recent recorded operations and data changes.</p></div><button class="btn sm danger" onclick="clearAllData()">Clear all local data</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Detail</th></tr></thead><tbody>${state.audit.slice(0,50).map(a=>`<tr><td>${dateTime(a.ts)}</td><td>${esc(a.actor)}</td><td>${esc(a.action)}</td><td>${esc(a.detail)}</td></tr>`).join('')||'<tr><td colspan="4">No activity recorded.</td></tr>'}</tbody></table></div></div>`;$('#settingsForm').onsubmit=e=>{e.preventDefault();Object.assign(state.settings,Object.fromEntries(new FormData(e.target)));audit('Settings changed','Operations configuration updated');persist('Settings saved');render()}}

function restoreSnapshot(){let raw=localStorage.getItem(SNAP);if(!raw){toast('No previous local snapshot is available.');return}if(!confirm('Restore the immediately previous saved snapshot? Current changes will be replaced.'))return;try{state=JSON.parse(raw);audit('Previous snapshot restored','Local recovery action');localStorage.setItem(KEY,JSON.stringify(state));toast('Previous snapshot restored');render();updateHeader()}catch(e){toast('Snapshot could not be restored.')}}

function basePayload(){return {format:'palmer-property-maintenance-secure-backup',version:8,exportedAt:now(),data:state}}
async function cryptoKey(password,salt,usage){let km=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,usage)}
function b64(u){return btoa(String.fromCharCode(...new Uint8Array(u)))}function unb64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function exportBackup(){let pass=prompt('Create a backup passphrase (minimum 8 characters). Store it separately from the backup file.');if(!pass||pass.length<8){toast('Backup cancelled — passphrase must be at least 8 characters.');return}let salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await cryptoKey(pass,salt,['encrypt']),cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(basePayload()))),wrap={format:'ppm-encrypted-backup',version:1,algorithm:'AES-GCM/PBKDF2-SHA-256',iterations:150000,salt:b64(salt),iv:b64(iv),ciphertext:b64(cipher)};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(wrap,null,2)],{type:'application/json'}));a.download=`PalmerPPM_encrypted_backup_${today()}.json`;a.click();URL.revokeObjectURL(a.href);state.settings.lastBackup=now();state.settings.lastBackupNote='Encrypted export created';audit('Encrypted backup created','Local protected export');persist('Encrypted backup created')}
async function importBackup(file){if(!file)return;try{let raw=JSON.parse(await file.text()),payload;if(raw.format==='ppm-encrypted-backup'){let pass=prompt('Enter the backup passphrase.');if(!pass)return;let key=await cryptoKey(pass,unb64(raw.salt),['decrypt']);let plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(raw.iv)},key,unb64(raw.ciphertext));payload=JSON.parse(new TextDecoder().decode(plain))}else payload=raw;if(!payload?.data?.schema){toast('This is not a recognised Palmer PPM backup.');return}let incoming=payload.data,summary=`Backup: ${payload.exportedAt||'unknown date'}\nWork orders: ${(incoming.tickets||[]).length}\nProperties: ${(incoming.properties||[]).length}\nContractors: ${(incoming.contractors||[]).length}\n\nOK = replace all current local data. Cancel = merge records with new IDs only.`;if(confirm(summary)){state=incoming;audit('Backup restored','Full encrypted/local backup restore');persist('Backup restored');render();toast('Backup restored')}else{let add=(key,arr)=>{let ids=new Set(state[key].map(x=>x.id));(arr||[]).forEach(x=>{if(!ids.has(x.id))state[key].push(x)})};add('tickets',incoming.tickets);add('properties',incoming.properties);add('contractors',incoming.contractors);state.audit.unshift(...(incoming.audit||[]).filter(x=>!state.audit.some(y=>y.id===x.id)));audit('Backup merged','New record IDs imported');persist('Backup merged');render();toast('Backup merged')}}catch(e){console.error(e);toast('Restore failed — incorrect passphrase or invalid backup file.')}}
function exportCSV(kind){let rows,fn;if(kind==='finance'){rows=[['Reference','Property','Status','Contractor','Selected Quote','Actual Cost','Invoice','Approver','Decision'],...state.tickets.map(t=>{let q=selectedQuote(t);return[t.ref,t.propertyName,t.status,q?.contractorName||'',q?.total||'',t.actualCost||'',t.invoiceNo||'',t.approval?.by||'',t.approval?.decision||'']})];fn='PalmerPPM_finance'}else{rows=[['Reference','Property','Area','Category','Priority','Status','Due','Scheduled','Next Owner','Actual Cost'],...state.tickets.map(t=>[t.ref,t.propertyName,t.area,t.category,t.priority,t.status,t.due,t.scheduledDate,t.nextOwner,t.actualCost||''])];fn='PalmerPPM_workorders'}let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=fn+'_'+today()+'.csv';a.click();URL.revokeObjectURL(a.href)}

function openPDF(title,bodyHtml,subtitle=''){let w=window.open('','_blank','width=1040,height=900');if(!w){toast('Allow pop-ups to save as PDF.');return}let styles=`<style>@page{size:auto;margin:16mm}*{box-sizing:border-box}body{font:12px Arial,sans-serif;color:#111;padding:0;margin:0}.print-brand{display:flex;gap:14px;align-items:center;border-bottom:3px solid #0f5f86;padding:0 0 12px;margin-bottom:16px}.print-brand img{width:62px;height:62px;object-fit:contain}.print-brand h1{font-size:22px;margin:0;color:#10283b}.print-brand p{margin:4px 0 0;color:#3e5d70;font-size:12px}h2{font-size:16px;color:#10283b;margin:18px 0 8px}h3{font-size:14px;color:#10283b}.print-meta{font-size:10px;color:#607887;margin-top:20px;border-top:1px solid #aab8c2;padding-top:7px}table{width:100%;border-collapse:collapse;margin:10px 0}th{background:#e7f0f5;color:#173245;text-align:left;font-size:10px;text-transform:uppercase}td,th{border:1px solid #aebdc7;padding:7px;vertical-align:top}button,input,select,textarea,.no-print{display:none!important}.card,.property-card{box-shadow:none!important;border:1px solid #aebdc7!important;background:#fff!important;color:#111!important;padding:12px!important;margin:10px 0!important}.grid{display:block!important}.stats{display:grid!important;grid-template-columns:repeat(3,1fr)!important}.stat{display:block!important}.stat .v{font-size:20px!important}.muted,.tiny,.sub{color:#465d6c!important}.badge{display:inline-block!important;border:1px solid #789!important;padding:3px 5px!important;color:#111!important;background:#f4f7f8!important}.list-row{border-bottom:1px solid #c9d3d9!important;padding:7px 0!important}.risk,.notice{border:1px solid #aebdc7!important;background:#f5f8fa!important;color:#111!important}.table-wrap{overflow:visible!important}.table{min-width:0!important}a{color:#111;text-decoration:none}</style>`;w.document.write(`<!doctype html><html><head><base href="${location.href}"><meta charset="utf-8"><title>${esc(title)} — Palmer Property Maintenance</title>${styles}</head><body>${printableHeader(title,subtitle)}${bodyHtml}<footer class="print-meta">Generated ${dateTime(now())} • Palmer Property Maintenance • Use the browser destination “Save to PDF” to create the PDF.</footer><script>window.onload=()=>setTimeout(()=>window.print(),180)<\/script></body></html>`);w.document.close()}
function printCurrentSection(){let copy=$('#view').cloneNode(true);copy.querySelectorAll('button,input,select,textarea').forEach(el=>{let text=el.value||el.textContent||'';if(text){let s=document.createElement('span');s.textContent=text;el.replaceWith(s)}else el.remove()});let labels={dashboard:'Operations Dashboard',tickets:'Work Order Register',properties:'Properties & Assets',schedule:'Schedule & Planned Maintenance',finance:'Financial Control Register',contractors:'Contractor Register',reports:'Owner Reports',settings:'Data Protection & Settings'};openPDF(labels[route]||'Operations Report',copy.innerHTML,`Save as PDF • ${date(today())}`)}
function printTicket(tid){let t=state.tickets.find(x=>x.id===tid),q=selectedQuote(t);openPDF(`Job Card • ${t.ref}`,`<p><b>Status:</b> ${esc(statuses[t.status])} &nbsp; <b>Priority:</b> ${esc(t.priority)} &nbsp; <b>Due:</b> ${date(t.due)}</p><table><tr><th>Property / area</th><td>${esc(t.propertyName)} • ${esc(t.area)}</td><th>Appointment</th><td>${date(t.scheduledDate)} ${esc(t.appointmentWindow)}</td></tr><tr><th>Reporter</th><td>${esc(t.reporter)} ${esc(t.reporterContact)}</td><th>Next owner</th><td>${esc(t.nextOwner||'—')}</td></tr><tr><th>Fault</th><td colspan="3">${esc(t.desc)}</td></tr><tr><th>Risk controls</th><td colspan="3">${esc(t.risk||'—')}</td></tr><tr><th>Access instructions</th><td colspan="3">${esc(t.accessNotes||'—')}</td></tr><tr><th>Selected contractor / quote</th><td colspan="3">${esc(q?.contractorName||'—')} • ${q?money(q.total):'—'}</td></tr></table><h2>Completion record</h2><p>${esc(t.completionNote||'Pending completion')}</p>`,`Work Order • ${t.propertyName}`)}
function printOwnerPack(){let open=state.tickets.filter(t=>!['done','declined'].includes(t.status));openPDF('Owner Pack',`<p>Prepared for <b>${esc(state.settings.owner)}</b></p><h2>Open work and risk</h2><table><tr><th>Reference</th><th>Property</th><th>Fault</th><th>Due</th><th>Status</th><th>Cost</th></tr>${open.map(t=>`<tr><td>${esc(t.ref)}</td><td>${esc(t.propertyName)} • ${esc(t.area)}</td><td>${esc(t.desc)}</td><td>${date(t.due)}</td><td>${esc(statuses[t.status])}</td><td>${selectedQuote(t)?money(selectedQuote(t).total):'—'}</td></tr>`).join('')}</table><h2>Financial summary</h2><p>Actual recorded cost: <b>${money(state.tickets.reduce((n,t)=>n+Number(t.actualCost||0),0))}</b> • Monthly budget: <b>${state.settings.monthlyBudget?money(state.settings.monthlyBudget):'Not set'}</b></p>`,`Owner: ${state.settings.owner||'—'}`)}
init();
</script></body></html>
